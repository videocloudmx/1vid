<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .content-container {
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .ad-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .ad-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .ad-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            width: 340px; /* Un poco más que el iframe para el padding */
        }
        .video-container {
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            display: block;
        }
        /* Estilos responsivos */
        @media (max-width: 600px) {
            .ad-container {
                width: 100%;
                max-width: 340px;
            }
        }
    </style>
</head>
<body>

    <div class="content-container">
        <!-- Sección del anuncio con tamaño 320x100 -->
        <div class="ad-section">
            <div class="ad-label">Ad</div>
            <div class="ad-container">
                <iframe src="https://haseebtraffic.com/ad.php?pid=122" width="320" height="100" frameborder="0" scrolling="no"></iframe>
            </div>
        </div>
        
        <!-- Contenedor del video -->
        <div class="video-container">
            <video controls poster="https://via.placeholder.com/800x450?text=Cargando+Video...">
                <source src="https://qu.ax/KRvaw.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de videos en HTML5.
            </video>
        </div>
    </div>

</body>
